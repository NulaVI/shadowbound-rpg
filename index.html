<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#10131a">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="style.css">
<title>Shadowbound — AI RPG</title>
</head>
<body>
<div class="app">
  <header>
    <div>
      <div class="eyebrow">AI TABLETOP RPG</div>
      <h1>Shadowbound</h1>
    </div>
    <button id="resetBtn" class="iconBtn" title="New game">↻</button>
  </header>

  <main>
    <section id="setup" class="panel">
      <h2>Create Your Hero</h2>
      <p class="muted">Your first playable prototype. Your character is saved on this device.</p>
      <label>Name<input id="name" placeholder="Your hero's name" maxlength="24"></label>
      <label>Class
        <select id="class">
          <option>Warrior</option><option>Rogue</option><option>Mage</option><option>Ranger</option>
        </select>
      </label>
      <label>Background
        <select id="background">
          <option>Wanderer</option><option>Noble</option><option>Outcast</option><option>Scholar</option>
        </select>
      </label>
      <button id="startBtn" class="primary">Begin Adventure</button>
    </section>

    <section id="game" class="hidden">
      <div class="heroCard panel">
        <div class="portrait">⚔️</div>
        <div class="heroInfo">
          <h2 id="heroName">Hero</h2>
          <div id="heroMeta" class="muted"></div>
          <div class="bars">
            <div><span>HP</span><b id="hpText"></b></div>
            <div class="bar"><i id="hpBar"></i></div>
            <div><span>XP</span><b id="xpText"></b></div>
            <div class="bar xp"><i id="xpBar"></i></div>
          </div>
        </div>
      </div>

      <div class="story panel" id="story">
        <div class="sceneTag">THE BROKEN CRYPT</div>
        <p id="narrative"></p>
        <div id="log"></div>
      </div>

      <div class="actions">
        <button data-action="explore">🔎 Explore</button>
        <button data-action="attack">⚔️ Attack</button>
        <button data-action="talk">💬 Talk</button>
        <button data-action="rest">🔥 Rest</button>
      </div>

      <div class="dice panel">
        <div class="diceTitle">D20 CHECK</div>
        <div id="diceFace">20</div>
        <div id="diceResult" class="muted">Choose an action that requires a roll.</div>
        <button id="rollBtn" class="primary">Roll D20</button>
      </div>

      <div class="tabs">
        <button class="tab active" data-tab="character">Character</button>
        <button class="tab" data-tab="inventory">Inventory</button>
        <button class="tab" data-tab="quests">Quests</button>
      </div>

      <div id="characterTab" class="panel tabPanel">
        <div class="statGrid" id="stats"></div>
      </div>
      <div id="inventoryTab" class="panel tabPanel hidden">
        <h3>Inventory</h3><div id="inventory"></div>
      </div>
      <div id="questsTab" class="panel tabPanel hidden">
        <h3>Quest Log</h3>
        <div class="quest"><b>The Broken Crypt</b><br><span class="muted">Find out what is moving beneath the old crypt.</span></div>
      </div>
    </section>
  </main>
</div>
<script src="app.js"></script>
</body>
</html>
